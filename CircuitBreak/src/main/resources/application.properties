# ==========================================
# CONFIGURACIÓN GENERAL
# ==========================================

spring.application.name=CircuitBreak
server.port=8080


# ==========================================
# ACTUATOR
# ==========================================

management.endpoints.web.exposure.include=health,info,metrics

management.endpoint.health.show-details=always


# ==========================================
# INFORMACIÓN DE LA APLICACIÓN
# ==========================================

info.app.name=CircuitBreak
info.app.description=Microservicio de consumo de API con OpenFeign y Circuit Breaker
info.app.version=1.0.0


# ==========================================
# RESILIENCE4J - CIRCUIT BREAKER
# ==========================================

resilience4j.circuitbreaker.instances.miCircuito.register-health-indicator=true

resilience4j.circuitbreaker.instances.miCircuito.sliding-window-type=COUNT_BASED

resilience4j.circuitbreaker.instances.miCircuito.sliding-window-size=10

resilience4j.circuitbreaker.instances.miCircuito.minimum-number-of-calls=5

resilience4j.circuitbreaker.instances.miCircuito.failure-rate-threshold=50

resilience4j.circuitbreaker.instances.miCircuito.wait-duration-in-open-state=10s

resilience4j.circuitbreaker.instances.miCircuito.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.miCircuito.automatic-transition-from-open-to-half-open-enabled=true