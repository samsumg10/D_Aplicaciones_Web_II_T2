spring.application.name=api-gateway
server.port=8080

# --- Eureka: el Gateway también se registra y consulta el registro para resolver lb://<servicio> ---
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
eureka.instance.hostname=${SERVICE_HOST:localhost}
eureka.instance.instance-id=${spring.application.name}:${server.port}

# --- Tiempos de espera hacia los microservicios ---
# Conexión: 2 s (servicio caído o inaccesible -> 503). Respuesta: 10 s (servicio colgado -> 504 Gateway Timeout).
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=10s

# --- Rutas: ruta pública -> nombre lógico del servicio en Eureka (lb = con balanceo de carga) ---
spring.cloud.gateway.server.webflux.routes[0].id=pacientes
spring.cloud.gateway.server.webflux.routes[0].uri=lb://pacientes
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/pacientes/**

spring.cloud.gateway.server.webflux.routes[1].id=citas
spring.cloud.gateway.server.webflux.routes[1].uri=lb://citas
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/citas/**

spring.cloud.gateway.server.webflux.routes[2].id=atenciones
spring.cloud.gateway.server.webflux.routes[2].uri=lb://atenciones
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/atenciones/**

spring.cloud.gateway.server.webflux.routes[3].id=laboratorio
spring.cloud.gateway.server.webflux.routes[3].uri=lb://laboratorio
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/laboratorio/**

spring.cloud.gateway.server.webflux.routes[4].id=hospitalizacion
spring.cloud.gateway.server.webflux.routes[4].uri=lb://hospitalizacion
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/hospitalizaciones/**

spring.cloud.gateway.server.webflux.routes[5].id=farmacia
spring.cloud.gateway.server.webflux.routes[5].uri=lb://farmacia
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/farmacia/**

spring.cloud.gateway.server.webflux.routes[6].id=facturacion-pagos
spring.cloud.gateway.server.webflux.routes[6].uri=lb://facturacion-pagos
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/pagos/**,/api/cargos/**

spring.cloud.gateway.server.webflux.routes[7].id=notificaciones
spring.cloud.gateway.server.webflux.routes[7].uri=lb://notificaciones
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/notificaciones/**

spring.cloud.gateway.server.webflux.routes[8].id=auditoria
spring.cloud.gateway.server.webflux.routes[8].uri=lb://auditoria
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/api/auditoria/**

# --- Actuator: /actuator/gateway/routes lista las rutas cargadas (evidencia de la configuración) ---
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=read-only
