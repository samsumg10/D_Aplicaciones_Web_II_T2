spring.application.name=farmacia
server.port=8086

# Credenciales: se leen de variables de entorno o del archivo .env de la raíz del workspace (no se versiona).
# Ver .env.example. Nunca escribir contraseñas en este archivo.
spring.config.import=optional:file:../.env[.properties]

# --- PostgreSQL reactivo (R2DBC). Base propia del servicio: hospital_farmacia ---
spring.r2dbc.url=r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/hospital_farmacia
spring.r2dbc.username=${DB_USER}
spring.r2dbc.password=${DB_PASSWORD}
# Crea las tablas (schema.sql) y carga el catálogo de demostración (data.sql) al iniciar
spring.sql.init.mode=always

# --- Eureka ---
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
eureka.instance.hostname=${SERVICE_HOST:localhost}
eureka.instance.instance-id=${spring.application.name}:${server.port}

# --- RabbitMQ ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
# Si RabbitMQ no responde, no se retiene la petición HTTP más de 3 segundos
spring.rabbitmq.connection-timeout=3s

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
