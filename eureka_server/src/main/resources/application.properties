spring.application.name=eureka-server
server.port=8761

# Este servidor es el registro: no se registra a sí mismo ni descarga el registro de otro servidor
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.instance.hostname=localhost

# Entorno académico (una sola máquina): se desactiva la autopreservación para que un servicio detenido
# desaparezca del panel en segundos en lugar de quedar listado como si siguiera activo.
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000

management.endpoints.web.exposure.include=health,info
