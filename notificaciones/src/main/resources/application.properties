spring.application.name=notificaciones
server.port=8088

# Credenciales: variables de entorno o archivo .env de la raíz del workspace (no se versiona). Ver .env.example.
spring.config.import=optional:file:../.env[.properties]

# --- PostgreSQL reactivo (R2DBC). Base propia del servicio: hospital_notificaciones ---
spring.r2dbc.url=r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/hospital_notificaciones
spring.r2dbc.username=${DB_USER}
spring.r2dbc.password=${DB_PASSWORD}
spring.sql.init.mode=always

# --- Eureka ---
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
eureka.instance.hostname=${SERVICE_HOST:localhost}
eureka.instance.instance-id=${spring.application.name}:${server.port}

# --- RabbitMQ (consumidor) ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.connection-timeout=3s
# Un mensaje que falla no se reencola en bucle: se rechaza y RabbitMQ lo mueve a notificaciones.eventos.dlq
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
